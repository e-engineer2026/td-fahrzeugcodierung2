name: Update discount tiers once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-discount-tiers.yml

permissions:
  contents: write

jobs:
  update-discounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update discount calculation and labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          booking = Path('app/components/BookingConfigurator.tsx')
          text = booking.read_text()
          old_rate = 'return value >= 200 ? 0.2 : value >= 150 ? 0.15 : value >= 100 ? 0.1 : value >= 50 ? 0.05 : 0;'
          new_rate = 'return value >= 200 ? 0.2 : value >= 100 ? 0.15 : value >= 50 ? 0.1 : 0;'
          old_tier = 'return value < 50 ? 50 : value < 100 ? 100 : value < 150 ? 150 : value < 200 ? 200 : null;'
          new_tier = 'return value < 50 ? 50 : value < 100 ? 100 : value < 200 ? 200 : null;'
          if old_rate not in text:
              raise SystemExit('Old discountRate pattern not found')
          if old_tier not in text:
              raise SystemExit('Old nextTier pattern not found')
          booking.write_text(text.replace(old_rate, new_rate).replace(old_tier, new_tier))

          live = Path('app/components/ConfiguratorLiveActions.tsx')
          text = live.read_text()
          old_label = '5 % ab 50 € · 10 % ab 100 € · 15 % ab 150 € · 20 % ab 200 €'
          new_label = '10 % ab 50 € · 15 % ab 100 € · 20 % ab 200 €'
          old_hint = 'snapshot.nextTier === "50" ? 5 : snapshot.nextTier === "100" ? 10 : snapshot.nextTier === "150" ? 15 : 20'
          new_hint = 'snapshot.nextTier === "50" ? 10 : snapshot.nextTier === "100" ? 15 : 20'
          if old_label not in text:
              raise SystemExit('Old discount label pattern not found')
          if old_hint not in text:
              raise SystemExit('Old discount hint pattern not found')
          live.write_text(text.replace(old_label, new_label).replace(old_hint, new_hint))
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/BookingConfigurator.tsx app/components/ConfiguratorLiveActions.tsx
          git commit -m "Rabattstufen auf 10/15/20 Prozent anpassen"
          git push origin main
