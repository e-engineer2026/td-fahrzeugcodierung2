name: Verify website changes

on:
  pull_request:
    branches: [main, feature/central-service-orders-20261123, feature/service-calcom-bridge-20261124]
  push:
    branches:
      - feature/central-service-orders-20261123
      - security/pdf-payment-claims-20261123
      - feature/service-calcom-bridge-20261124
      - feature/admin-command-center-20261124

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tdtest
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tdtest
        options: >-
          --health-cmd "pg_isready -U tdtest -d tdtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint newly added TypeScript files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=A origin/main...HEAD | grep -E '^app/.*\.(ts|tsx)$' || true)
          if (( ${#files[@]} > 0 )); then
            npx eslint "${files[@]}"
          else
            echo "No new TypeScript files to lint"
          fi
      - name: Targeted regression tests (unchanged legacy suite tracked separately)
        shell: bash
        run: |
          if test -f scripts/service-orders.test.mjs; then
            node --experimental-strip-types --test scripts/service-orders.test.mjs
          fi
          if test -f scripts/payment-claims.test.mjs; then
            node --experimental-strip-types --test scripts/payment-claims.test.mjs
          fi
          if test -f scripts/cal-booking-webhook.test.mjs; then
            node --experimental-strip-types --test scripts/cal-booking-webhook.test.mjs
          fi
          if test -f scripts/admin-dashboard.test.mjs; then
            node --experimental-strip-types --test scripts/admin-dashboard.test.mjs
          fi
      - name: Isolated PostgreSQL admin and Cal.com KPI test
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U tdtest -d tdtest < scripts/admin-dashboard-postgres-integration.sql
      - name: Next.js build and type checks (without live secrets)
        run: npm run build
