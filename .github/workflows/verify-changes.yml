name: Verify website changes

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/central-service-orders-20261123
      - security/pdf-payment-claims-20261123

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Production build (without live secrets)
        run: npm run build
