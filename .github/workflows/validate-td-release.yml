name: Validate TD website release

on:
  push:
    branches:
      - release/td-redesign-and-emblems-2026-10-21

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
