name: Technical preflight checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/technical-preflight-20261124]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check new preflight modules
        run: npx eslint app/lib/technicalPreflight.ts app/components/TechnicalPreflightCard.tsx
      - name: Targeted regression tests
        run: node --experimental-strip-types --test scripts/technical-preflight.test.mjs
      - name: Production build (without live secrets)
        run: npm run build
