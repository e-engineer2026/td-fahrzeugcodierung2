name: Apply curated light and infotainment lists

on:
  push:
    paths:
      - '.github/workflows/apply-light-infotainment-curation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curate light and infotainment functions
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path('app/components/BookingConfigurator.tsx')
          text = path.read_text(encoding='utf-8')
          block = base64.b64decode('').decode('utf-8')

          if 'const curatedLightRules: CuratedDisplayRule[]' not in text:
              anchor = 'function normalize(value: string) {'
              if anchor not in text:
                  raise SystemExit('normalize anchor not found')
              text = text.replace(anchor, block + '\n' + anchor, 1)

          old_no_source = 'if (!source) return curateComfortEntries(curateAssistEntries(vehicleEntries.filter((entry) => yearAllowed(entry.name, year))));'
          new_no_source = 'if (!source) return curateLightAndInfotainmentEntries(curateComfortEntries(curateAssistEntries(vehicleEntries.filter((entry) => yearAllowed(entry.name, year)))));'
          if old_no_source in text:
              text = text.replace(old_no_source, new_no_source, 1)
          elif new_no_source not in text:
              raise SystemExit('no-source return anchor not found')

          old_final = 'return curateComfortEntries(curateAssistEntries(Array.from(byName.values()).filter((entry) => yearAllowed(entry.name, year))));'
          new_final = 'return curateLightAndInfotainmentEntries(curateComfortEntries(curateAssistEntries(Array.from(byName.values()).filter((entry) => yearAllowed(entry.name, year)))));'
          if old_final in text:
              text = text.replace(old_final, new_final, 1)
          elif new_final not in text:
              raise SystemExit('final return anchor not found')

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Commit curated light and infotainment lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/BookingConfigurator.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Curate light and infotainment functions and prices"
          git push
