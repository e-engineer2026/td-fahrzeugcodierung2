name: Update contact email once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-email-once.yml

permissions:
  contents: write

jobs:
  update-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace old email everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'info@td-fahrzeugcodierung.com'
          new = 'td.codierung@gmail.com'
          changed = []
          text_suffixes = {'.ts', '.tsx', '.js', '.jsx', '.json', '.md', '.txt', '.css', '.html', '.yml', '.yaml', '.xml'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'README', 'LICENSE'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('Old email address not found')

          print('Updated files:')
          for path in changed:
              print(path)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/update-email-once.yml
          git commit -m "E-Mail-Adresse projektweit auf td.codierung@gmail.com ändern"
          git push origin main
