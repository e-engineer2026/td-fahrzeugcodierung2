name: Finalize assist coding list

on:
  push:
    paths:
      - '.github/workflows/curate-assist-codings.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct assist list logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/components/BookingConfigurator.tsx')
          text = path.read_text(encoding='utf-8')

          start = text.index('const curatedAssistRules: CuratedAssistRule[]')
          end = text.index('function normalize(value: string)', start)
          block = text[start:end]
          block = block.replace('\\\\b', '\\b').replace('\\\\s', '\\s').replace('\\\\/', '\\/')
          text = text[:start] + block + text[end:]

          old_candidate = '''  const assistCandidate = (entry: UnifiedCodingEntry) =>
            entry.uiGroup === "Assistenz" ||
            /(bergabfahrassistent|berganfahrassistent|auto[ -]?hold|gespannstabilisierung|manövrierassistent|manoevrierassistent|anhängerrangierassistent|anhaengerrangierassistent)/i.test(entry.name);'''
          new_candidate = '''  const assistCandidate = (entry: UnifiedCodingEntry) =>
            entry.uiGroup === "Assistenz" ||
            /(tempomat|speed.?limiter|geschwindigkeits.?begrenzer|geschwindigkeits.?limiter|bergabfahrassistent|berganfahrassistent|auto[ -]?hold|gespannstabilisierung|manövrierassistent|manoevrierassistent|anhängerrangierassistent|anhaengerrangierassistent)/i.test(entry.name);'''
          if old_candidate in text:
              text = text.replace(old_candidate, new_candidate, 1)
          elif new_candidate not in text:
              raise SystemExit('assistCandidate anchor not found')

          old_other = '  const otherEntries = entries.filter((entry) => !assistCandidate(entry));'
          new_other = '''  const otherEntries = entries.filter((entry) =>
            !assistCandidate(entry) &&
            !/(ausstiegswarnung|front.*kamera.*kalibrier|vorfeldkamera.*kalibrier)/i.test(entry.name)
          );'''
          if old_other in text:
              text = text.replace(old_other, new_other, 1)
          elif new_other not in text:
              raise SystemExit('otherEntries anchor not found')

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Commit finalized website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/BookingConfigurator.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Finalize curated assist coding list"
          git push
