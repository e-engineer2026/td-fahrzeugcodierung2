name: Fix light and infotainment curation typos

on:
  push:
    paths:
      - '.github/workflows/fix-light-infotainment-typos.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix curation typos
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/components/BookingConfigurator.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Tagfahrlicht Einstelungen anpassen', 'Tagfahrlicht Einstellungen anpassen')
          text = text.replace('(?=.*ambiient)', '(?=.*ambient)')
          path.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/BookingConfigurator.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix light and infotainment curation typos"
          git push
