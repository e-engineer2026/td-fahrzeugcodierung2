name: Temporary MQB evo lane fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[mqb-lane-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MQB evo SFD2 lane options
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/components/BookingConfigurator.tsx')
          s = p.read_text()

          old_logic = '''function vehicleSpecificCodings(
            vehicle: Vehicle,
            year: number,
            isSfd1: boolean,
            isSfd2: boolean
          ): UnifiedCodingEntry[] {
            if (isSfd2) return [];

            const ids = new Set(codingsForVehicle(vehicle));
            const vehicleCatalog = codingCatalog
              .filter((coding) => ids.has(coding.id))
              .filter((coding) => {
                if (!isSfd1 || coding.category !== "Assistenzsysteme") return true;
                if (coding.id === "mqbevo-lane-onstate" || coding.id === "mqbevo-adaptive-lane") return true;
                return !/(aktivieren|freischalten|codieren|parametrieren)/i.test(coding.name);
              });'''

          new_logic = '''function vehicleSpecificCodings(
            vehicle: Vehicle,
            year: number,
            isSfd1: boolean,
            isSfd2: boolean
          ): UnifiedCodingEntry[] {
            const isMqbevoSfd2 = isSfd2 && vehicle.platform === "MQBevo";
            if (isSfd2 && !isMqbevoSfd2) return [];

            const ids = new Set(codingsForVehicle(vehicle));
            const vehicleCatalog = codingCatalog
              .filter((coding) => ids.has(coding.id))
              .filter((coding) => {
                if (isMqbevoSfd2) return coding.id === "mqbevo-lane-onstate" || coding.id === "mqbevo-adaptive-lane";
                if (!isSfd1 || coding.category !== "Assistenzsysteme") return true;
                if (coding.id === "mqbevo-lane-onstate" || coding.id === "mqbevo-adaptive-lane") return true;
                return !/(aktivieren|freischalten|codieren|parametrieren)/i.test(coding.name);
              });

            if (isMqbevoSfd2) {
              return curateCodingEntries(vehicleCatalog.map((coding) => ({
                id: `vehicle-${coding.id}`,
                name: coding.name,
                price: coding.price,
                uiGroup: coding.uiGroup as PlatformCodingGroup,
                hardware: coding.hardware ?? coding.requirements,
                source: "vehicle" as const,
              })).filter((entry) => yearAllowed(entry.name, year)));
            }'''

          if old_logic in s:
              s = s.replace(old_logic, new_logic, 1)

          old_state = '''  const isSfd1 = Boolean(selectedVehicle?.sfd1From && year >= selectedVehicle.sfd1From && year < 2024);
  const isSfd2 = Boolean(selectedVehicle?.sfd1From && year >= 2024);'''
          new_state = '''  const isSfd1 = Boolean(selectedVehicle?.sfd1From && year >= selectedVehicle.sfd1From && year < 2024);
  const isSfd2 = Boolean(selectedVehicle?.sfd1From && year >= 2024);
  const isMqbevoSfd2 = isSfd2 && selectedVehicle?.platform === "MQBevo";
  const showCodings = !isSfd2 || isMqbevoSfd2;'''
          if old_state in s and 'const showCodings = !isSfd2 || isMqbevoSfd2;' not in s:
              s = s.replace(old_state, new_state, 1)

          s = s.replace('const bookingDisabled = !hasVehicle || !year || isSfd2 || selected.length === 0;', 'const bookingDisabled = !hasVehicle || !year || (isSfd2 && !isMqbevoSfd2) || selected.length === 0;')
          s = s.replace('disabled={!hasVehicle || !year || isSfd2}', 'disabled={!hasVehicle || !year || !showCodings}')
          s = s.replace('hasVehicle && year && !isSfd2 && popular.length > 0', 'hasVehicle && year && showCodings && popular.length > 0')
          s = s.replace('hasVehicle && year && !isSfd2 && <div', 'hasVehicle && year && showCodings && <div')
          s = s.replace(': isSfd2 ? <div className="mt-6 rounded-xl border border-slate-200 bg-slate-100 p-4 text-sm text-slate-700">Für dieses Fahrzeug und Baujahr wird die Codierauswahl aktuell nicht freigegeben.</div>', ': isSfd2 && !isMqbevoSfd2 ? <div className="mt-6 rounded-xl border border-slate-200 bg-slate-100 p-4 text-sm text-slate-700">Für dieses Fahrzeug und Baujahr wird die Codierauswahl aktuell nicht freigegeben.</div>')

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/BookingConfigurator.tsx
          git diff --cached --quiet || git commit -m 'Fix MQB evo lane options for SFD2 [mqb-lane-fix]'
          git push
