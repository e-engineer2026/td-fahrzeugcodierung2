name: Temporary MQB evo lane fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mqb-lane-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SFD2 MQB evo lane options
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/components/BookingConfigurator.tsx')
          s = p.read_text()
          old = '  if (isSfd2) return [];\n\n  const ids = new Set(codingsForVehicle(vehicle));'
          new = '''  const ids = new Set(codingsForVehicle(vehicle));

  if (isSfd2) {
    if (vehicle.platform !== "MQBevo") return [];
    const mqbevoLaneIds = new Set(["mqbevo-lane-onstate", "mqbevo-adaptive-lane"]);
    return curateCodingEntries(
      codingCatalog
        .filter((coding) => ids.has(coding.id) && mqbevoLaneIds.has(coding.id))
        .map((coding) => ({
          id: `vehicle-${coding.id}`,
          name: coding.name,
          price: coding.price,
          uiGroup: coding.uiGroup as PlatformCodingGroup,
          hardware: coding.hardware ?? coding.requirements,
          source: "vehicle" as const,
        }))
        .filter((entry) => yearAllowed(entry.name, year))
    );
  }

  const vehicleCatalog = codingCatalog
    .filter((coding) => ids.has(coding.id))'''
          if old not in s:
              raise SystemExit('Expected target text not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/BookingConfigurator.tsx
          git diff --cached --quiet || git commit -m 'Fix MQB evo lane options for SFD2 [mqb-lane-fix]'
          git push
